<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3efe8;
    --ink: #151515;
    --ink-soft: rgba(21, 21, 21, 0.55);
    --accent: #ff4d2e;
    --blob-1: #ffb08a;
    --blob-2: #b9a4ff;
    --blob-3: #7fd8c3;
    --blob-4: #8fc6ff;
    --rope: rgba(21, 21, 21, 0.72);
    --overlay-bg: rgba(243, 239, 232, 0.72);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f14;
      --ink: #f2eee7;
      --ink-soft: rgba(242, 238, 231, 0.55);
      --accent: #ff7a59;
      --blob-1: #c2412a;
      --blob-2: #5b3fd1;
      --blob-3: #138a73;
      --blob-4: #1f5fb8;
      --rope: rgba(242, 238, 231, 0.7);
      --overlay-bg: rgba(14, 15, 20, 0.72);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    overscroll-behavior: none;
  }

  /* ---------- 배경 ---------- */
  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    opacity: 0.75;
    will-change: transform;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) { background: radial-gradient(circle, var(--blob-1) 0%, transparent 62%); left: -25vmax; top: -20vmax; }
  .blob:nth-child(2) { background: radial-gradient(circle, var(--blob-2) 0%, transparent 62%); right: -30vmax; top: -10vmax; animation-duration: 31s; animation-delay: -8s; }
  .blob:nth-child(3) { background: radial-gradient(circle, var(--blob-3) 0%, transparent 62%); left: -10vmax; bottom: -40vmax; animation-duration: 23s; animation-delay: -4s; }
  .blob:nth-child(4) { background: radial-gradient(circle, var(--blob-4) 0%, transparent 62%); right: -20vmax; bottom: -35vmax; animation-duration: 35s; animation-delay: -15s; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(8vmax, 6vmax) scale(1.08); }
    100% { transform: translate(-6vmax, 10vmax) scale(0.95); }
  }

  .corner {
    position: fixed;
    z-index: 1;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    pointer-events: none;
    user-select: none;
  }
  .corner.tl { left: 20px; top: 18px; font-family: "Anton", sans-serif; font-size: 15px; letter-spacing: 0.12em; color: var(--ink); }
  .corner.bl { left: 20px; right: 20px; bottom: 18px; line-height: 1.6; }

  /* ---------- 물리 스테이지 ---------- */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #ropes {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .rope { position: absolute; inset: 0; pointer-events: none; }
  .letter {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Anton", "Arial Narrow", sans-serif;
    line-height: 1;
    color: color-mix(in oklab, var(--ink), var(--accent) calc(var(--p, 0) * 100%));
    opacity: calc(1 - var(--p, 0) * 0.2);
    will-change: transform;
  }
  .rope.ready .letter { color: var(--accent); opacity: 1; }

  /* ---------- 리퀴드 글래스 구슬 ---------- */
  #glass {
    position: absolute;
    left: 0;
    top: 0;
    width: calc(var(--r, 70px) * 2);
    height: calc(var(--r, 70px) * 2);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
    background: rgba(255, 255, 255, 0.03);
    -webkit-backdrop-filter: blur(3px) saturate(1.8) brightness(1.02);
    backdrop-filter: blur(3px) saturate(1.8) brightness(1.02);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.5),
      inset 0 10px 18px -10px rgba(255, 255, 255, 0.95),
      inset 0 -14px 24px -14px rgba(255, 255, 255, 0.55),
      inset 0 0 22px rgba(0, 0, 0, 0.06),
      0 24px 44px -18px rgba(10, 10, 30, 0.35);
    transition: box-shadow 0.2s;
  }
  #glass.lens {
    backdrop-filter: url(#lens-filter) blur(1.2px) saturate(1.8) brightness(1.02);
  }
  /* 스페큘러 하이라이트 (속도 반대 방향으로 밀림) */
  #glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at calc(32% + var(--hx, 0px)) calc(24% + var(--hy, 0px)),
        rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.25) 9%, transparent 24%),
      radial-gradient(circle at calc(68% - var(--hx, 0px)) calc(82% - var(--hy, 0px)),
        rgba(255, 255, 255, 0.35) 0%, transparent 22%);
    mix-blend-mode: screen;
  }
  #glass.held {
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.65),
      inset 0 10px 18px -10px rgba(255, 255, 255, 1),
      inset 0 -14px 24px -14px rgba(255, 255, 255, 0.6),
      inset 0 0 30px rgba(255, 255, 255, 0.12),
      0 30px 54px -18px rgba(10, 10, 30, 0.4);
  }

  /* ---------- 준비 중 오버레이 ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--overlay-bg);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    backdrop-filter: blur(24px) saturate(1.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.45s ease, visibility 0s linear 0.45s;
  }
  #overlay.open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.45s ease, visibility 0s;
  }
  .ov-inner { text-align: center; max-width: 520px; }
  .ov-kicker { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.2em; color: var(--accent); font-weight: 600; }
  #ov-title {
    margin: 0;
    font-family: "Anton", sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 16vw, 160px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    overflow-wrap: anywhere;
  }
  .ov-desc { margin: 16px 0 28px; color: var(--ink-soft); font-size: 15px; }
  #ov-close {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid currentColor;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  #ov-close:hover { background: var(--ink); color: var(--bg); }
  #ov-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- 접근성 ---------- */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .sr-nav a:focus {
    position: fixed !important;
    left: 16px; top: 16px;
    width: auto; height: auto;
    clip: auto;
    z-index: 20;
    padding: 10px 16px;
    background: var(--ink);
    color: var(--bg);
    border-radius: 8px;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    #overlay, #overlay.open { transition: none; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">Portfolio</h1>
  <nav class="sr-nav" aria-label="메인 메뉴">
    <ul id="sr-list" class="sr-only"></ul>
  </nav>

  <div id="bg" aria-hidden="true">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
  </div>
  <div class="corner tl" aria-hidden="true">PORTFOLIO</div>
  <div class="corner bl" aria-hidden="true" id="hint">줄을 끝까지 당겼다 놓으면 열려요 · 유리구슬은 잡고 던질 수 있어요</div>

  <div id="stage" aria-hidden="true">
    <canvas id="ropes"></canvas>
    <div id="letters"></div>
    <div id="glass"></div>
  </div>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="ov-inner">
      <p class="ov-kicker">준비 중</p>
      <h2 id="ov-title"></h2>
      <p class="ov-desc">이 페이지는 곧 열릴 예정이에요.</p>
      <button id="ov-close" type="button">돌아가기</button>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lens-filter" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage id="lens-map" x="0" y="0" width="140" height="140" preserveAspectRatio="none" result="map" />
      <feDisplacementMap id="lens-disp" in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
  // ===================================================================
  // 설정 — 메뉴는 이 배열만 수정하면 줄/글자가 자동 생성된다.
  // (2단계: Supabase menu_items 테이블에서 불러와 menus를 대체)
  // ===================================================================
  const CONFIG = {
    menus: [
      { label: "ABOUT",   href: "#about" },
      { label: "WORK",    href: "#work" },
      { label: "CONTACT", href: "#contact" },
    ],
    rope: {
      segments: 12,          // 줄 마디 수
      segmentLength: 14,     // 마디 길이(px), 화면 높이에 따라 비례 조정
      stiffness: 1,          // 마디 연결 강성 (기획 0.9 → 구슬 통과 방지를 위해 1)
      damping: 0.05,         // 흔들림 감쇠
      anchorStiffness: 0.03, // 천장 고정점 스프링 강성 (낮을수록 아래로 잘 늘어남)
      pullThreshold: 160,    // 기본 위치에서 이만큼(px) 아래로 당기면 페이지 열림
    },
    glass: {
      radius: 70,            // 구슬 반지름(px), 모바일에서는 화면 폭 비례로 축소
      restitution: 0.4,      // 바닥 튕김 정도
      density: 0.002,
      maxSpeed: 40,          // 최대 속도(px/frame) — 터널링 방지
    },
    gravity: 1,
    substeps: 8,             // 프레임당 물리 서브스텝 수
    dragStiffness: 0.03,     // 포인터 스프링 강성 (서브스텝마다 적용)
  };

  const { Engine, Bodies, Body, Composite, Constraint, Query, Vector } = Matter;

  const CAT = { WALL: 0x1, ROPE: 0x2, BALL: 0x4 };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const supportsLens = !!(navigator.userAgentData &&
    navigator.userAgentData.brands.some((b) => /Chromium/i.test(b.brand)));

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("ropes");
  const ctx = canvas.getContext("2d");
  const lettersEl = document.getElementById("letters");
  const glassEl = document.getElementById("glass");
  const overlay = document.getElementById("overlay");

  const engine = Engine.create({
    positionIterations: 10,
    velocityIterations: 8,
    constraintIterations: 10,
  });
  engine.gravity.y = CONFIG.gravity;
  const world = engine.world;

  let W = window.innerWidth;
  let H = window.innerHeight;
  let walls = [];
  let ropes = [];
  let ball = null;
  let ballR = 0;
  let grab = null;          // { constraint, body, rope, pointerId }
  let openRope = null;      // 오버레이가 열린 상태에서 끊어진 줄

  // ------------------------------------------------------------------
  // 크기 계산
  // ------------------------------------------------------------------
  function metrics() {
    const n = CONFIG.menus.length;
    const spacing = W / (n + 1);
    const scale = Math.min(1.15, Math.max(0.6, H / 900));
    const segLen = CONFIG.rope.segmentLength * scale;
    const longest = Math.max(...CONFIG.menus.map((m) => m.label.length));
    // 가장 긴 메뉴가 화면 높이의 ~85% 안에 들어오도록 폰트 크기 제한
    const byHeight = (H * 0.85 - CONFIG.rope.segments * segLen) / (longest * 0.95);
    const font = Math.max(22, Math.min(64, H * 0.06, spacing * 0.75 / 0.72, byHeight));
    return { n, spacing, segLen, font, lw: font * 0.72, lh: font * 0.9, gap: Math.max(1, font * 0.04) };
  }

  function glassRadius() {
    return Math.round(Math.max(36, Math.min(CONFIG.glass.radius, W * 0.12, H * 0.12)));
  }

  // ------------------------------------------------------------------
  // 벽
  // ------------------------------------------------------------------
  function buildWalls() {
    if (walls.length) Composite.remove(world, walls);
    const t = 400;
    const opts = { isStatic: true, collisionFilter: { category: CAT.WALL, mask: 0xffff } };
    walls = [
      Bodies.rectangle(W / 2, H + t / 2, W + t * 2, t, opts),   // 바닥
      Bodies.rectangle(W / 2, -t / 2, W + t * 2, t, opts),      // 천장
      Bodies.rectangle(-t / 2, H / 2, t, H + t * 2, opts),      // 왼쪽
      Bodies.rectangle(W + t / 2, H / 2, t, H + t * 2, opts),   // 오른쪽
    ];
    Composite.add(world, walls);
  }

  // ------------------------------------------------------------------
  // 메뉴 줄 + 세로 글자
  // ------------------------------------------------------------------
  function createRope(menu, index) {
    const m = metrics();
    const ax = m.spacing * (index + 1);
    const segR = m.segLen / 2;               // 마디 반지름 = 간격의 절반 → 틈 없음
    const group = Body.nextGroup(true);       // 같은 줄끼리는 충돌하지 않음
    const filter = { group, category: CAT.ROPE, mask: CAT.WALL | CAT.ROPE | CAT.BALL };
    const bodyOpts = { collisionFilter: filter, frictionAir: 0.02, density: 0.02, friction: 0.3 };

    const segs = [];
    let y = 0;
    for (let i = 0; i < CONFIG.rope.segments; i++) {
      y += m.segLen;
      segs.push(Bodies.circle(ax, y, segR, bodyOpts));
    }

    const wrap = document.createElement("div");
    wrap.className = "rope";
    lettersEl.appendChild(wrap);

    const letters = [];
    const els = [];
    y += segR + m.lh / 2;
    for (const ch of menu.label) {
      letters.push(Bodies.rectangle(ax, y, m.lw, m.lh, { ...bodyOpts, chamfer: { radius: m.lw * 0.12 } }));
      const el = document.createElement("span");
      el.className = "letter";
      el.textContent = ch;
      el.style.width = m.lw + "px";
      el.style.height = m.lh + "px";
      el.style.fontSize = m.font + "px";
      wrap.appendChild(el);
      els.push(el);
      y += m.lh + m.gap;
    }
    const nominalY = y - m.gap - m.lh / 2;

    const k = CONFIG.rope.stiffness;
    const d = CONFIG.rope.damping;
    const anchor = Constraint.create({
      pointA: { x: ax, y: 0 }, bodyB: segs[0], length: m.segLen,
      stiffness: CONFIG.rope.anchorStiffness, damping: 0.08,
    });
    const links = [];
    for (let i = 1; i < segs.length; i++) {
      links.push(Constraint.create({ bodyA: segs[i - 1], bodyB: segs[i], length: m.segLen, stiffness: k, damping: d }));
    }
    links.push(Constraint.create({
      bodyA: segs[segs.length - 1], bodyB: letters[0], pointB: { x: 0, y: -m.lh / 2 },
      length: segR, stiffness: k, damping: d,
    }));
    for (let i = 1; i < letters.length; i++) {
      links.push(Constraint.create({
        bodyA: letters[i - 1], pointA: { x: 0, y: m.lh / 2 },
        bodyB: letters[i], pointB: { x: 0, y: -m.lh / 2 },
        length: m.gap, stiffness: k, damping: d,
      }));
    }

    Composite.add(world, [...segs, ...letters, anchor, ...links]);

    return {
      menu, index, ax, segs, letters, anchor, links, wrap, els,
      lh: m.lh, lw: m.lw,
      restY: nominalY, progress: 0, snapped: false,
    };
  }

  function removeRope(rope) {
    Composite.remove(world, [...rope.segs, ...rope.letters, ...rope.links]);
    if (!rope.snapped) Composite.remove(world, rope.anchor);
    rope.wrap.remove();
  }

  function buildRopes() {
    for (const r of ropes) removeRope(r);
    ropes = CONFIG.menus.map((menu, i) => createRope(menu, i));
  }

  function ropeBodies() {
    return ropes.flatMap((r) => [...r.segs, ...r.letters]);
  }

  // ------------------------------------------------------------------
  // 리퀴드 글래스 구슬
  // ------------------------------------------------------------------
  function createBall() {
    ballR = glassRadius();
    // 줄 사이 가장 넓은 틈 위에서 떨어뜨린다
    const xs = [0, ...ropes.map((r) => r.ax), W];
    let bestX = W / 2, bestGap = -1;
    for (let i = 0; i < xs.length - 1; i++) {
      const g = xs[i + 1] - xs[i];
      const mid = (xs[i] + xs[i + 1]) / 2;
      // 비슷한 틈이면 화면 가운데에 가까운 쪽
      if (g > bestGap * 1.05 || (g > bestGap * 0.95 && Math.abs(mid - W / 2) < Math.abs(bestX - W / 2))) { bestGap = Math.max(g, bestGap); bestX = mid; }
    }
    bestX = Math.min(W - ballR - 4, Math.max(ballR + 4, bestX));
    ball = Bodies.circle(bestX, ballR + 4, ballR, {
      density: CONFIG.glass.density,
      restitution: CONFIG.glass.restitution,
      friction: 0.2,
      frictionAir: 0.008,
      collisionFilter: { category: CAT.BALL, mask: CAT.WALL | CAT.ROPE },
    });
    Composite.add(world, ball);
    checkGhost(true);
    updateLensMap();
  }

  // 구슬이 줄과 겹친 채로 생성/리사이즈되면 겹침이 풀릴 때까지 줄과의 충돌을 끈다
  function checkGhost(start) {
    if (start) ball.plugin.ghost = Query.collides(ball, ropeBodies()).length > 0;
    if (!ball.plugin.ghost) {
      ball.collisionFilter.mask = CAT.WALL | CAT.ROPE;
      return;
    }
    if (Query.collides(ball, ropeBodies()).length === 0) {
      ball.plugin.ghost = false;
      ball.collisionFilter.mask = CAT.WALL | CAT.ROPE;
    } else {
      ball.collisionFilter.mask = CAT.WALL;
    }
  }

  function resizeBall() {
    const r = glassRadius();
    if (r !== ballR) {
      Body.scale(ball, r / ballR, r / ballR);
      ballR = r;
      updateLensMap();
    }
    Body.setPosition(ball, {
      x: Math.min(W - ballR - 2, Math.max(ballR + 2, ball.position.x)),
      y: Math.min(H - ballR - 2, Math.max(ballR + 2, ball.position.y)),
    });
    checkGhost(true);
  }

  // 가장자리로 갈수록 강해지는 방사형 굴절 맵 (R/G 채널 = x/y 변위)
  function updateLensMap() {
    glassEl.style.setProperty("--r", ballR + "px");
    if (!supportsLens) return;
    const size = ballR * 2;
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const nx = (x + 0.5 - ballR) / ballR;
        const ny = (y + 0.5 - ballR) / ballR;
        const dist = Math.hypot(nx, ny);
        let dx = 0, dy = 0;
        if (dist < 1 && dist > 0) {
          const edge = Math.pow(Math.max(0, (dist - 0.45) / 0.55), 2.2);
          dx = -(nx / dist) * edge;
          dy = -(ny / dist) * edge;
        }
        const i = (y * size + x) * 4;
        img.data[i] = 128 + dx * 127;
        img.data[i + 1] = 128 + dy * 127;
        img.data[i + 2] = 128;
        img.data[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    const map = document.getElementById("lens-map");
    map.setAttribute("href", c.toDataURL());
    map.setAttribute("width", size);
    map.setAttribute("height", size);
    document.getElementById("lens-disp").setAttribute("scale", Math.round(ballR * 0.55));
    glassEl.classList.add("lens");
  }

  // ------------------------------------------------------------------
  // 드래그 (포인터 → 스프링 Constraint, 위치 직접 덮어쓰기 X)
  // ------------------------------------------------------------------
  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  function hitTest(p) {
    if (Vector.magnitude(Vector.sub(p, ball.position)) <= ballR) return { body: ball, rope: null };
    for (const rope of ropes) {
      if (rope.snapped) continue;
      const hit = Query.point(rope.letters, p)[0];
      if (hit) return { body: hit, rope };
    }
    return null;
  }

  stage.addEventListener("pointerdown", (e) => {
    if (grab || overlay.classList.contains("open")) return;
    const p = pointerPos(e);
    const hit = hitTest(p);
    if (!hit) return;

    if (reducedMotion) {
      if (hit.rope) openPage(hit.rope.menu, null);
      return;
    }

    const constraint = Constraint.create({
      pointA: p,
      bodyB: hit.body,
      pointB: Vector.sub(p, hit.body.position),
      length: 0,
      stiffness: CONFIG.dragStiffness,
      damping: 0.1,
    });
    Composite.add(world, constraint);
    grab = { constraint, body: hit.body, rope: hit.rope, pointerId: e.pointerId };
    stage.setPointerCapture(e.pointerId);
    stage.style.cursor = "grabbing";
    if (hit.body === ball) glassEl.classList.add("held");
    e.preventDefault();
  });

  stage.addEventListener("pointermove", (e) => {
    const p = pointerPos(e);
    if (grab && e.pointerId === grab.pointerId) {
      grab.constraint.pointA.x = p.x;
      grab.constraint.pointA.y = p.y;
      return;
    }
    if (e.pointerType === "mouse") stage.style.cursor = hitTest(p) ? (reducedMotion ? "pointer" : "grab") : "";
  });

  function release(e) {
    if (!grab || e.pointerId !== grab.pointerId) return;
    Composite.remove(world, grab.constraint);
    const rope = grab.rope;
    glassEl.classList.remove("held");
    stage.style.cursor = "";
    grab = null;
    if (rope && rope.progress >= 1) snapRope(rope);
  }
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);

  // ------------------------------------------------------------------
  // 당김 판정 → 줄 끊김 → placeholder 페이지
  // ------------------------------------------------------------------
  function updatePull(rope) {
    const last = rope.letters[rope.letters.length - 1];
    const held = grab && grab.rope === rope;
    if (!held && !rope.snapped && last.speed < 0.05) {
      // 정지 상태일 때 기본 위치를 천천히 갱신 (구슬이 얹혀 있는 경우 등)
      rope.restY += (last.position.y - rope.restY) * 0.02;
    }
    const raw = held ? (last.position.y - rope.restY) / CONFIG.rope.pullThreshold : 0;
    rope.progress = Math.max(0, raw);
    const p = Math.min(1, Math.max(0, (rope.progress - 0.4) / 0.6));
    rope.wrap.style.setProperty("--p", p.toFixed(3));
    rope.wrap.classList.toggle("ready", rope.progress >= 1);
  }

  function snapRope(rope) {
    rope.snapped = true;
    rope.progress = 0;
    rope.wrap.classList.remove("ready");
    Composite.remove(world, rope.anchor);
    for (const b of rope.segs) Body.setVelocity(b, { x: (Math.random() - 0.5) * 3, y: -2 });
    setTimeout(() => openPage(rope.menu, rope), 650);
  }

  function openPage(menu, rope) {
    if (!menu.href.startsWith("#")) {
      window.location.href = menu.href;
      return;
    }
    openRope = rope;
    document.getElementById("ov-title").textContent = menu.label;
    overlay.classList.add("open");
    document.getElementById("ov-close").focus();
  }

  function closePage() {
    overlay.classList.remove("open");
    if (openRope) {
      const i = ropes.indexOf(openRope);
      removeRope(openRope);
      ropes[i] = createRope(openRope.menu, openRope.index);
      if (reducedMotion) renderOnce();
      else checkGhost(true);
      openRope = null;
    }
  }
  document.getElementById("ov-close").addEventListener("click", closePage);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) closePage();
  });

  // 키보드/스크린리더용 링크
  const srList = document.getElementById("sr-list");
  for (const menu of CONFIG.menus) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = menu.href;
    a.textContent = menu.label;
    a.addEventListener("click", (e) => {
      if (menu.href.startsWith("#")) {
        e.preventDefault();
        openPage(menu, null);
      }
    });
    li.appendChild(a);
    srList.appendChild(li);
  }

  // ------------------------------------------------------------------
  // 렌더링
  // ------------------------------------------------------------------
  let dpr = 1;
  let ropeColor = "";
  let accentColor = "";

  function sizeCanvas() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const cs = getComputedStyle(document.documentElement);
    ropeColor = cs.getPropertyValue("--rope").trim();
    accentColor = cs.getPropertyValue("--accent").trim();
  }

  function drawRopes() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (const rope of ropes) {
      const pts = [];
      if (!rope.snapped) pts.push({ x: rope.ax, y: 0 });
      for (const s of rope.segs) pts.push(s.position);
      const first = rope.letters[0];
      pts.push(Vector.add(first.position, Vector.rotate({ x: 0, y: -rope.lh / 2 }, first.angle)));

      ctx.strokeStyle = rope.progress >= 0.6 ? accentColor : ropeColor;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i].x + pts[i + 1].x) / 2;
        const my = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      const end = pts[pts.length - 1];
      ctx.lineTo(end.x, end.y);
      ctx.stroke();

      if (!rope.snapped) {
        ctx.fillStyle = ropeColor;
        ctx.beginPath();
        ctx.arc(rope.ax, 0, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawLetters() {
    for (const rope of ropes) {
      for (let i = 0; i < rope.letters.length; i++) {
        const b = rope.letters[i];
        rope.els[i].style.transform =
          `translate(${b.position.x - rope.lw / 2}px, ${b.position.y - rope.lh / 2}px) rotate(${b.angle}rad)`;
      }
    }
  }

  // 속도에 따른 말랑한 변형 + 하이라이트 이동
  const glassFx = { sx: 0, angle: 0, hx: 0, hy: 0, press: 0 };
  function drawGlass() {
    const v = Body.getVelocity(ball);
    const speed = Math.hypot(v.x, v.y);
    const held = grab && grab.body === ball;
    glassFx.sx += (Math.min(0.14, speed / 220) - glassFx.sx) * 0.25;
    if (speed > 0.5) glassFx.angle = Math.atan2(v.y, v.x);
    glassFx.hx += (Math.max(-14, Math.min(14, -v.x * 0.8)) - glassFx.hx) * 0.2;
    glassFx.hy += (Math.max(-14, Math.min(14, -v.y * 0.8)) - glassFx.hy) * 0.2;
    glassFx.press += ((held ? 1 : 0) - glassFx.press) * 0.2;

    const s = 1 + glassFx.press * 0.07;
    const a = glassFx.angle;
    glassEl.style.transform =
      `translate(${ball.position.x - ballR}px, ${ball.position.y - ballR}px) ` +
      `rotate(${a}rad) scale(${s * (1 + glassFx.sx)}, ${s * (1 - glassFx.sx * 0.8)}) rotate(${-a}rad)`;
    glassEl.style.setProperty("--hx", glassFx.hx.toFixed(1) + "px");
    glassEl.style.setProperty("--hy", glassFx.hy.toFixed(1) + "px");
  }

  function renderOnce() {
    drawRopes();
    drawLetters();
    drawGlass();
  }

  // ------------------------------------------------------------------
  // 루프 (rAF 1개, 고정 서브스텝)
  // ------------------------------------------------------------------
  const STEP = 1000 / 60 / CONFIG.substeps;
  let acc = 0;
  let lastTime = 0;
  let rafId = 0;

  function clampBallSpeed() {
    const max = CONFIG.glass.maxSpeed;
    if (Body.getSpeed(ball) > max) Body.setSpeed(ball, max);
  }

  function frame(now) {
    const dt = Math.min(50, now - lastTime);
    lastTime = now;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < CONFIG.substeps * 3) {
      clampBallSpeed();
      Engine.update(engine, STEP);
      acc -= STEP;
      n++;
    }
    if (n === CONFIG.substeps * 3) acc = 0;

    if (ball.plugin.ghost) checkGhost(false);
    for (const rope of ropes) updatePull(rope);
    renderOnce();
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    if (rafId || reducedMotion) return;
    lastTime = performance.now();
    acc = 0;
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));

  // ------------------------------------------------------------------
  // 리사이즈 (디바운스)
  // ------------------------------------------------------------------
  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      W = window.innerWidth;
      H = window.innerHeight;
      if (grab) { Composite.remove(world, grab.constraint); grab = null; }
      sizeCanvas();
      buildWalls();
      buildRopes();
      resizeBall();
      if (reducedMotion) placeStaticBall();
      renderOnce();
    }, 180);
  });

  // ------------------------------------------------------------------
  // 시작
  // ------------------------------------------------------------------
  function placeStaticBall() {
    Body.setPosition(ball, { x: W - ballR - Math.min(80, W * 0.08), y: H - ballR });
  }

  sizeCanvas();
  buildWalls();
  buildRopes();
  createBall();
  if (reducedMotion) {
    // 물리 없이 정적인 세로 메뉴 + 정지된 구슬
    document.getElementById("hint").textContent = "메뉴를 눌러 열어보세요";
    placeStaticBall();
    renderOnce();
  } else {
    renderOnce();
    start();
  }
  </script>
</body>
</html>
