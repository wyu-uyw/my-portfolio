<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work — KIM HANEUL</title>
<meta name="description" content="작업 — 컬렉션과 스와치">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
<link href="assets/site.css" rel="stylesheet">
<script src="assets/theme.js"></script>
<style>
  /* 원형 진열이 헤더 아래 남은 화면 높이를 채운다 (푸터는 그 아래로 스크롤) */
  main.work {
    display: flex;
    flex-direction: column;
    max-width: none;
    min-height: calc(100svh - var(--header-h, 57px));
    padding: 12px var(--gutter) 0;
  }
  /* 탭 · 기법 필터: 원형 영역 위에 작게 한 덩어리 */
  .work-bar { width: 100%; max-width: var(--max); margin: 0 auto; }
  /* 탭 줄: 왼쪽 Collections / Swatch, 오른쪽 원형 / 목록 */
  .bar-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .work-bar .tabs { margin: 0; border-bottom: 0; }
  .work-bar .filters { margin-bottom: 0; }
  .work-bar .filters[hidden] { display: none; }
  #panel { flex: 1; display: flex; flex-direction: column; }

  /* ---------- 원형 진열 ---------- */
  .ring {
    position: relative;
    flex: 1;
    min-height: 460px;
    overflow: hidden;
    touch-action: none;            /* 원형 영역에서만 끌어 돌리기 (밖은 페이지 스크롤) */
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .ring.dragging { cursor: grabbing; }
  .ring:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  /* 12시에 맞춰진 작품은 누르면 열림 */
  .ring:not(.dragging) .ring-item.is-sel .ri-thumb { cursor: pointer; }
  .ring[hidden] { display: none; }
  .ring-items { position: absolute; inset: 0; }
  /* 작품 한 점: 원 위의 한 점에 고정, 썸네일은 그 점을 가운데로 (기울지 않음) */
  .ring-item { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
  .ri-thumb { position: absolute; }
  /* 작품 이미지에는 색 보정 · 필터를 넣지 않는다 */
  .ri-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--line); }
  .ri-thumb .ph { width: 100%; height: 100%; aspect-ratio: auto; background-color: color-mix(in srgb, var(--text) 9%, var(--bg)); }
  /* 선택 상태(12시)일 때만: 위에 제목, 아래에 연도 · 기법 태그 · 한 줄 설명. 위치 · 투명도는 JS가 transform · opacity로 */
  .ri-title, .ri-info {
    position: absolute;
    left: 0;
    top: 0;
    width: max-content;
    max-width: min(340px, 86vw);
    margin: 0;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .ri-title {
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 28px);
    line-height: 1.2;
    color: var(--text);
    word-break: keep-all;
  }
  .ri-meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
  .ri-year { font-size: 12px; font-weight: 500; letter-spacing: 0.16em; color: var(--accent); margin-right: 2px; }
  .ri-desc {
    margin: 6px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 가운데 다이얼: 메인 레버와 같은 흰 직선 · 점 */
  .ring-dial { position: absolute; left: 0; top: 0; overflow: visible; color: var(--lever); pointer-events: none; }
  .ring-dial .dl-line { stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .ring-dial .dl-pivot { fill: currentColor; }
  .ring-dial .dl-dot { fill: currentColor; opacity: 0.3; }
  /* 첫 방문 안내: 회전 방향 곡선 화살표 + 글자, 첫 조작 뒤 사라짐 */
  .ring-dial .dl-arrow { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; transition: opacity 0.4s ease; }
  .ring-hint {
    position: absolute;
    left: 0;
    top: 0;
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-soft);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .ring.hinted .dl-arrow, .ring.hinted .ring-hint { opacity: 0; }
  .ring-count {
    position: absolute;
    left: 0;
    top: 0;
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--text-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .ring { min-height: 420px; }
  }

  /* 보기 방식 전환: 작은 텍스트 버튼 */
  .view-toggle { padding-bottom: 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0.08em; color: var(--text-faint); }
  .view-toggle button { font: inherit; padding: 4px 2px; border: 0; background: none; color: var(--text-soft); cursor: pointer; border-bottom: 1px solid transparent; }
  .view-toggle button:hover { color: var(--text); }
  .view-toggle button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  /* 목록 보기: 회전 없이 한눈에 — 썸네일 + 제목 + 정보 */
  .list-view { width: 100%; max-width: var(--max); margin: 28px auto 80px; display: grid; gap: 36px 20px; grid-template-columns: repeat(auto-fill, minmax(min(46%, 200px), 1fr)); }
  .list-view[hidden] { display: none; }
  .lv-title { margin: 12px 0 4px; font-size: 17px; font-weight: 400; }
  .card:hover .lv-title { color: var(--accent); }
  .lv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .lv-desc { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-soft); }
</style>
</head>
<body data-page="work" data-title="Work">
  <main class="work">
    <h1 class="sr-only">Work</h1>

    <div class="work-bar">
      <div class="bar-top">
        <div class="tabs" role="tablist" aria-label="작업 구분">
          <button class="tab" type="button" role="tab" id="tab-collections" aria-controls="panel" data-tab="collections">Collections</button>
          <button class="tab" type="button" role="tab" id="tab-swatch" aria-controls="panel" data-tab="swatch">Swatch</button>
        </div>
        <!-- 빨리 훑어보는 방문자를 위한 대체 경로: 원형 / 목록 -->
        <div class="view-toggle" role="group" aria-label="보기 방식">
          <button type="button" data-view="ring">원형</button><span aria-hidden="true">/</span><button type="button" data-view="list">목록</button>
        </div>
      </div>

      <!-- 기법 필터는 목록 보기에서만 (원형 보기는 탭과 원형 / 목록 전환만 두고 간결하게) -->
      <div class="filters" id="filters">
        <div class="chip-row" role="group" aria-label="기법 (복수 선택)">
          <span class="chip-label">TECHNIQUE</span>
          <button class="chip" type="button" data-tech="weave">Weave</button>
          <button class="chip" type="button" data-tech="print">Print</button>
          <button class="chip" type="button" data-tech="stitch">Stitch</button>
          <button class="chip" type="button" data-tech="dye">Dye</button>
          <button class="chip" type="button" data-tech="manipulation">Manipulation</button>
        </div>
      </div>
    </div>

    <div id="panel" role="tabpanel">
      <div class="ring" id="ring" tabindex="0" role="listbox" aria-label="작품 원형 진열 — ←/→로 돌리고 Enter로 열기" hidden>
        <svg class="ring-dial" aria-hidden="true">
          <g class="dl-rot">
            <g class="dl-dots"></g>
            <line class="dl-line" x1="0" y1="0" x2="0" y2="-50"></line>
          </g>
          <circle class="dl-pivot" r="3"></circle>
          <path class="dl-arrow"></path>
        </svg>
        <p class="ring-count" aria-hidden="true"></p>
        <p class="ring-hint" aria-hidden="true">돌려서 둘러보기</p>
        <div class="ring-items"></div>
      </div>
      <div class="list-view" id="list" hidden></div>
      <p class="empty" id="empty" hidden></p>
      <!-- 원 위 항목과 같은 목록 (스크린리더용 · 스와치 라이트박스 열기용) -->
      <ul class="sr-only" id="ring-links"></ul>
    </div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/site.js"></script>
  <script src="assets/work-ring.js"></script>
  <script>
  // 탭·기법 필터는 주소(?tab=swatch&tech=weave,dye)에 남겨 공유·뒤로가기 시 유지
  // 12시에 선택된 항목도 주소(?item=…)에 남겨, 상세에서 뒤로 오면 같은 항목이 선택된 상태로
  const state = {
    tab: param("tab") === "swatch" ? "swatch" : "collections",
    tech: new Set((param("tech") || "").split(",").filter((t) => t in LABELS.technique)),
    item: param("item"),
  };
  let collections = [], projects = [], swatches = [];
  const emptyEl = document.getElementById("empty");
  const ringEl = document.getElementById("ring");
  const listEl = document.getElementById("list");
  // 보기 방식(원형 / 목록)은 브라우저에 기억
  const VIEW_KEY = "workView";
  let view = "ring";
  try { if (localStorage.getItem(VIEW_KEY) === "list") view = "list"; } catch (_) {}
  // 작품 상세의 기법 태그(?tech=…)로 들어오면 기법 필터가 있는 목록 보기로 (저장된 보기는 바꾸지 않음)
  if (param("tech")) view = "list";
  const linksEl = document.getElementById("ring-links");
  const ring = createRing(ringEl, {
    // 회전이 멈추면 12시 항목을 주소에 남긴다
    onSettle(it) {
      state.item = it.id;
      syncUrl();
    },
    // 12시 항목 열기: 컬렉션 → 컬렉션 상세, 스와치 → 기존처럼 크게 + 정보 (라이트박스)
    onOpen(it, i) {
      state.item = it.id;
      syncUrl();
      if (it.href) location.href = it.href;
      else linksEl.querySelectorAll("[data-lb]")[i]?.click();
    },
  });

  // 원형 영역이 헤더 아래 남은 높이를 채우도록 헤더 높이를 알려 준다
  function measureHeader() {
    const h = document.querySelector(".site-header")?.offsetHeight || 57;
    document.documentElement.style.setProperty("--header-h", h + "px");
  }
  measureHeader();
  addEventListener("resize", measureHeader);

  // 선택한 기법 중 하나라도 쓰면 통과 (OR). 선택이 없으면 전부. 기법 필터는 목록 보기에서만 (원형 보기는 항상 전부)
  const usesTech = (techniques) => view !== "list" || !state.tech.size || techniques.some((t) => state.tech.has(t));
  const firstSentence = (text) => (paragraphs(text)[0] || "").split(/(?<=[.。!?])\s/)[0];
  // 썸네일 주소 — 지금은 원본. 작은 썸네일을 만들게 되면 여기만 바꾼다 (12시로 확대될 때는 srcLarge = 원본으로 교체)
  const thumbSrc = (src) => src || null;

  function syncUrl() {
    const q = new URLSearchParams();
    if (state.tab === "swatch") q.set("tab", "swatch");
    if (state.tech.size && view === "list") q.set("tech", [...state.tech].join(","));
    if (state.item) q.set("item", state.item);
    if (param("ringdemo")) q.set("ringdemo", param("ringdemo"));
    history.replaceState(null, "", q.toString() ? "?" + q : location.pathname);
  }

  // 원 위에 놓을 항목: 현재 탭 + 기법 필터
  function collectionItems() {
    return collections.map((c) => {
      // 컬렉션 안 작품들의 기법을 모아서 거르기 · 정보 표시
      const techs = [...new Set(projects.filter((w) => w.collection_id === c.id).flatMap((w) => w.techniques))];
      return {
        id: c.id, title: c.title, src: thumbSrc(c.cover_image), srcLarge: c.cover_image, ratio: 4 / 5,
        year: c.year, techs, tags: techs.map((t) => LABELS.technique[t]), desc: firstSentence(c.concept),
        href: `collection.html?id=${encodeURIComponent(c.id)}`, featured: c.is_featured,
      };
    }).filter((it) => usesTech(it.techs));
  }
  function swatchItems() {
    return swatches.filter((w) => usesTech(w.techniques)).map((w) => ({
      id: w.id, title: w.title, src: thumbSrc(w.cover_image), srcLarge: w.cover_image, ratio: 1,
      year: w.year, techs: w.techniques, tags: w.techniques.map((t) => LABELS.technique[t]), desc: w.fiber, work: w,
    }));
  }

  // animate: 필터 · 탭을 바꿀 때 원이 새 항목 수로 부드럽게 다시 배치됨
  // fromFilter: 필터를 바꾼 경우 선택은 첫 항목으로 (그 외엔 주소의 ?item → 대표 컬렉션 → 첫 항목)
  function render({ animate = false, fromFilter = false } = {}) {
    document.querySelectorAll("[data-tab]").forEach((b) => {
      const on = b.dataset.tab === state.tab;
      b.setAttribute("aria-selected", String(on));
      b.tabIndex = on ? 0 : -1;
    });
    document.getElementById("panel").setAttribute("aria-labelledby", "tab-" + state.tab);
    document.querySelectorAll("[data-tech]").forEach((b) =>
      b.setAttribute("aria-pressed", String(state.tech.has(b.dataset.tech))));

    let list = state.tab === "swatch" ? swatchItems() : collectionItems();
    // 확인용: ?ringdemo=50 → 항목을 반복해서 개수를 늘려 본다 (겹침 · 간격 확인)
    const demo = parseInt(param("ringdemo"), 10);
    if (demo > 0 && list.length) list = Array.from({ length: demo }, (_, i) => ({ ...list[i % list.length], id: list[i % list.length].id + "~" + i }));

    emptyEl.hidden = !!list.length;
    emptyEl.textContent = state.tab === "swatch" ? "조건에 맞는 스와치가 없어요." : "조건에 맞는 컬렉션이 없어요.";
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    document.getElementById("filters").hidden = view !== "list";
    // 처음 선택할 항목: 주소의 ?item, 없으면 대표 컬렉션(처음 들어왔을 때), 없으면 첫 항목
    let start = list.findIndex((it) => it.id === state.item);
    if (start < 0 && !fromFilter) start = list.findIndex((it) => it.featured);
    start = Math.max(0, start);
    state.item = list[start]?.id || null;
    if (view === "list") {
      // 목록 보기: 숨은 목록 대신 보이는 격자 (스와치는 같은 라이트박스)
      linksEl.innerHTML = "";
      ringEl.hidden = true;
      listEl.hidden = !list.length;
      listEl.innerHTML = list.map(listCard).join("");
      syncUrl();
      return;
    }
    listEl.hidden = true;
    listEl.innerHTML = "";
    linksEl.innerHTML = list.map((it) => it.href
      ? `<li><a href="${esc(it.href)}">${esc(it.title)}</a></li>`
      : `<li>${zoomable({ src: it.work.cover_image, alt: it.title, ratio: "1 / 1", label: "", caption: `${it.title} · ${it.year}`, info: swatchInfo(it.work), group: "swatch" })}</li>`).join("");
    ring.setItems(list, start, { animate });
    syncUrl();
  }
  // 목록 보기 한 칸: 썸네일 + 제목 + 연도 · 기법 태그 + 한 줄 설명
  function listCard(it) {
    const meta = `<div class="lv-meta">${it.year ? `<span class="ri-year">${esc(it.year)}</span>` : ""}${it.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    const text = `<h2 class="lv-title">${esc(it.title)}</h2>${meta}${it.desc ? `<p class="lv-desc">${esc(it.desc)}</p>` : ""}`;
    if (it.href) return `<a class="card" href="${esc(it.href)}" data-item="${esc(it.id)}"><div class="frame">${media(it.src, it.title, "4 / 5", "")}</div>${text}</a>`;
    return `<div>${zoomable({ src: it.work.cover_image, alt: it.title, ratio: "1 / 1", label: "", caption: `${it.title} · ${it.year}`, info: swatchInfo(it.work), group: "swatch" })}${text}</div>`;
  }
  // 스와치 라이트박스 정보: 기법 · 섬유 · 크기 · 메모 (기존과 같음)
  const swatchInfo = (w) => [w.techniques.map((t) => LABELS.technique[t]).join(" · "), w.fiber, w.size, w.description]
    .filter(Boolean).join("  /  ");

  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    if (state.tab === b.dataset.tab) return;
    state.tab = b.dataset.tab;
    state.item = null;
    render({ animate: true });
  }));
  // 탭 사이를 ←/→로 이동
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    state.tab = state.tab === "swatch" ? "collections" : "swatch";
    state.item = null;
    render({ animate: true });
    document.getElementById("tab-" + state.tab).focus();
  });
  document.querySelectorAll("[data-tech]").forEach((b) => b.addEventListener("click", () => {
    const t = b.dataset.tech;
    state.tech.has(t) ? state.tech.delete(t) : state.tech.add(t);
    state.item = null;
    render({ animate: true, fromFilter: true });
  }));

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    if (view === b.dataset.view) return;
    view = b.dataset.view;
    try { localStorage.setItem(VIEW_KEY, view); } catch (_) {}
    render();
  }));
  // 목록에서 컬렉션을 열면 그 항목을 주소에 남겨, 뒤로 와서 원형으로 바꿔도 같은 항목이 선택되게
  listEl.addEventListener("click", (e) => {
    const a = e.target.closest("[data-item]");
    if (a) { state.item = a.dataset.item; syncUrl(); }
  });

  Promise.all([DB.collections(), DB.works("project"), DB.works("swatch")]).then(([c, p, s]) => {
    collections = c; projects = p; swatches = s;
    render();
  });
  </script>
</body>
</html>
