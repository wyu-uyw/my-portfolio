<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wyw | 포트폴리오</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<!-- 색은 배색 프리셋 토큰만 읽는다 (assets/theme.css). 배경 + 격자는 하위 페이지 공통 (assets/site.css) -->
<link href="assets/theme.css" rel="stylesheet">
<link href="assets/site.css" rel="stylesheet">
<script src="assets/theme.js"></script>
<style>
  /* 화면 가운데 한 덩어리: 큰 글씨 · 한 줄 안내 · 홈 버튼 */
  .nf {
    flex: 1;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 0;
    padding: 64px var(--gutter);
    text-align: center;
  }
  .nf-code {
    margin: 0 0 16px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.24em;
    color: var(--accent);
  }
  .nf-title {
    margin: 0 0 14px;
    font-weight: 300;
    font-size: clamp(36px, 7vw, 88px);
    line-height: 1.1;
    letter-spacing: 0.02em;
    word-break: keep-all;
    /* 메인 이름과 같은 얇은 포인트 외곽선 */
    -webkit-text-stroke: 1.5px var(--name-stroke);
    paint-order: stroke fill;
  }
  .nf-text {
    margin: 0 0 36px;
    font-size: 17px;
    color: var(--text-soft);
  }
  /* 메인 펼쳐 보기의 '작품 보기' 버튼과 같은 알약 버튼 */
  .nf-home {
    display: inline-block;
    padding: 10px 22px;
    border: 1px solid var(--text);
    border-radius: 999px;
    background: var(--text);
    color: var(--bg);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .nf-home:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <main class="nf">
    <p class="nf-code">404</p>
    <h1 class="nf-title">페이지를 찾을 수 없어요</h1>
    <p class="nf-text">주소를 다시 확인해 주세요</p>
    <a class="nf-home" href="index.html">홈으로 가기</a>
  </main>
</body>
</html>
