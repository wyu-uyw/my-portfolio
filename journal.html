<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<meta name="description" content="작업 일지 — Making, Research, Exhibition, Note">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="assets/site.css" rel="stylesheet">
<script>try { if (localStorage.getItem("theme") === "inverse") document.documentElement.dataset.theme = "inverse"; } catch (_) {}</script>
<style>
  .posts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .post a {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
  }
  @media (min-width: 720px) { .post a { grid-template-columns: 140px 1fr; gap: 28px; } }
  .post .meta { font-size: 12.5px; letter-spacing: 0.08em; color: var(--text-soft); }
  .post .meta b { font-weight: 500; color: var(--accent); }
  .post h2 { margin: 4px 0 6px; font-size: clamp(18px, 2.4vw, 22px); font-weight: 400; line-height: 1.4; }
  .post p { margin: 0; color: var(--text-soft); font-size: 14.5px; }
  .post a:hover h2 { color: var(--accent); }
  .post a:hover .ph, .post a:hover .media { border-color: var(--accent); }
</style>
</head>
<body data-page="journal">
  <main>
    <p class="kicker">Notes</p>
    <h1 class="page-title">Journal</h1>
    <p class="page-lead">만드는 과정, 리서치, 전시 이야기와 짧은 메모.</p>

    <div class="filters">
      <div class="chip-row" role="group" aria-label="카테고리">
        <span class="chip-label">CATEGORY</span>
        <button class="chip" type="button" data-cat="all">All</button>
        <button class="chip" type="button" data-cat="making">Making</button>
        <button class="chip" type="button" data-cat="research">Research</button>
        <button class="chip" type="button" data-cat="exhibition">Exhibition</button>
        <button class="chip" type="button" data-cat="note">Note</button>
      </div>
    </div>

    <ul id="list" class="posts"></ul>
  </main>

  <script src="assets/site.js"></script>
  <script src="assets/data.js"></script>
  <script>
  let cat = param("category") || "all";
  let posts = [];

  function render() {
    document.querySelectorAll("[data-cat]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.cat === cat)));
    const shown = posts.filter((p) => cat === "all" || p.category === cat);
    document.getElementById("list").innerHTML = shown.length
      ? shown.map((p) => `
        <li class="post">
          <a href="journal-post.html?id=${encodeURIComponent(p.id)}">
            ${media(p.thumbnail, p.title, "1 / 1", LABELS.category[p.category].toUpperCase())}
            <div>
              <div class="meta"><time datetime="${p.date}">${formatDate(p.date)}</time> · <b>${LABELS.category[p.category]}</b></div>
              <h2>${esc(p.title)}</h2>
              <p>${esc(p.summary)}</p>
            </div>
          </a>
        </li>`).join("")
      : `<li class="empty">이 카테고리에는 아직 글이 없어요.</li>`;
  }

  document.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => {
    cat = b.dataset.cat;
    history.replaceState(null, "", cat === "all" ? location.pathname : "?category=" + cat);
    render();
  }));

  DB.posts().then((data) => { posts = data; render(); });
  </script>
</body>
</html>
