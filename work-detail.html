<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Detail</title>
<meta name="description" content="작업 상세 — 컨셉, 소재, 과정, 갤러리">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="assets/site.css" rel="stylesheet">
<style>
  .hero { margin: 8px 0 28px; }
  .overview { display: grid; gap: 24px; }
  @media (min-width: 820px) { .overview { grid-template-columns: 1.3fr 1fr; gap: 48px; } }
  .work-title { margin: 6px 0 10px; font-weight: 300; font-size: clamp(36px, 7vw, 72px); line-height: 1.05; }
  .concept { font-size: 17px; max-width: 38em; }
  .process { display: grid; gap: 28px 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); counter-reset: step; }
  .step h3 { margin: 12px 0 4px; font-size: 15px; font-weight: 500; }
  .step h3::before { counter-increment: step; content: "0" counter(step) "  "; color: var(--accent); letter-spacing: 0.08em; }
  .step p { margin: 0; color: var(--text-soft); font-size: 14.5px; }
  .gallery { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .gallery figure { margin: 0; }
  .gallery figcaption { margin-top: 8px; font-size: 13px; color: var(--text-soft); }
  .gallery .detail figcaption::after { content: " · DETAIL"; color: var(--accent); letter-spacing: 0.1em; font-size: 11px; }
</style>
</head>
<body data-page="work">
  <main id="main"><p class="empty">불러오는 중…</p></main>

  <script src="assets/site.js"></script>
  <script src="assets/data.js"></script>
  <script>
  const main = document.getElementById("main");

  function pagerLink(w, cls, label) {
    if (!w) return `<span class="${cls}"></span>`;
    return `<a class="${cls}" href="work-detail.html?id=${encodeURIComponent(w.id)}"><small>${label}</small>${esc(w.title)}</a>`;
  }

  async function load() {
    const works = await DB.works();
    const i = works.findIndex((w) => w.id === param("id"));
    if (i < 0) {
      main.innerHTML = `<p class="empty">작업을 찾을 수 없어요.<br><br><a class="btn" href="work.html">목록으로</a></p>`;
      return;
    }
    const w = works[i];
    document.title = `${w.title} — Work`;
    const m = w.materials || {};

    main.innerHTML = `
      <div class="hero">${media(w.cover, w.title, "16 / 9", "COVER")}</div>

      <section class="overview" aria-label="개요">
        <div>
          <p class="kicker">${LABELS.section[w.section]} · ${w.year}</p>
          <h1 class="work-title">${esc(w.title)}</h1>
          <div class="tags">${w.techniques.map((t) => `<a class="tag" href="work.html?tech=${t}" style="text-decoration:none">${LABELS.technique[t]}</a>`).join("")}</div>
          <p class="concept">${esc(w.concept || w.summary)}</p>
        </div>
        <div>
          <h2 class="section-title" style="margin-top:0">Material</h2>
          <dl class="spec">
            <dt>섬유 조성</dt><dd>${esc(m.fiber || "—")}</dd>
            <dt>기법</dt><dd>${esc(m.technique || "—")}</dd>
            <dt>크기</dt><dd>${esc(m.size || "—")}</dd>
            <dt>사용 도구</dt><dd>${esc(m.tools || "—")}</dd>
          </dl>
        </div>
      </section>

      ${w.process.length ? `
      <h2 class="section-title">Process</h2>
      <ol class="process" style="list-style:none;padding:0;margin:0">
        ${w.process.map((p) => `
          <li class="step">
            ${media(p.image, p.step, "1 / 1", p.step)}
            <h3>${esc(p.step)}</h3>
            <p>${esc(p.text)}</p>
          </li>`).join("")}
      </ol>` : ""}

      ${w.gallery.length ? `
      <h2 class="section-title">Gallery</h2>
      <div class="gallery">
        ${w.gallery.map((g) => `
          <figure class="${g.detail ? "detail" : ""}">
            ${media(g.src, g.caption, g.detail ? "1 / 1" : "4 / 5", g.detail ? "DETAIL" : "IMAGE")}
            <figcaption>${esc(g.caption)}</figcaption>
          </figure>`).join("")}
      </div>` : ""}

      <nav class="pager" aria-label="작업 이동">
        ${pagerLink(works[i - 1], "prev", "← PREV")}
        <a class="list" href="work.html">LIST</a>
        ${pagerLink(works[i + 1], "next", "NEXT →")}
      </nav>`;
  }
  load();
  </script>
</body>
</html>
